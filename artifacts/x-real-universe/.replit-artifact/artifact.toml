kind = "web"
previewPath = "/"
title = "EXOVANTA"
description = "An offline-first EXOVANTA home menu and lightweight playable 3D habitat prototype for desktop and mobile."
version = "1.0.0"
id = "artifacts/x-real-universe"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19443

[services.development]
run = "pnpm --filter @workspace/x-real-universe run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/x-real-universe", "run", "build" ]
serve = "static"
publicDir = "artifacts/x-real-universe/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19443"
BASE_PATH = "/"
